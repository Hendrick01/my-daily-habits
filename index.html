<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Acompanhe hábitos diários, sequências e progresso." />
    <title>My Daily Habits</title>
    <script>
      // Aplica o tema salvo antes do React carregar, para a tela não piscar.
      try {
        const theme = localStorage.getItem("my-daily-habits:theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
