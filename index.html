<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Acompanhe hábitos diários, sequências e progresso." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>My Daily Habits</title>
    <script>
      // Aplica o tema salvo antes do React carregar, para a tela não piscar.
      try {
        const theme = localStorage.getItem("my-daily-habits:theme");
        if (theme) document.documentElement.dataset.theme = theme;
      } catch {}
      // Modo celular (escolhido no botão 📱 ou pela largura da tela), também antes do React.
      let layout = null;
      try {
        layout = localStorage.getItem("my-daily-habits:layout");
      } catch {}
      document.documentElement.dataset.layout =
        layout === "mobile" || layout === "desktop" ? layout : matchMedia("(max-width: 640px)").matches ? "mobile" : "desktop";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
